
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm ci

  build:
    commands:
      - echo "Building React application..."
      - npm run build
      - echo "Preparing deployment package..."
      - mkdir -p website
      - cp -r build/. website/

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - website/**/*
